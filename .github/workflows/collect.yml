name: Collect WIPO live transcript
run-name: collect ${{ inputs.meeting_id }}

# Actions 탭 > "Collect WIPO live transcript" > Run workflow 로 수동 실행.
# 회의 시작 전이면 대기하다가 시작되면 저장을 시작하고, 회의가 끝나면(idle) 자동 종료한다.
on:
  workflow_dispatch:
    inputs:
      meeting_id:
        description: "WIPO meeting_id (URL의 meeting_id 값)"
        default: "db9f085696a115b4e7b251498aecf4a1_no_delay"
        required: true
      max_minutes:
        description: "최대 실행 시간(분, 대기 시간 포함). GitHub 한도 360분"
        default: "345"
        required: true
      idle_exit_minutes:
        description: "데이터 수신 후 이 시간(분) 동안 변화가 없으면 종료 (점심시간 등 감안)"
        default: "180"
        required: true
      start_line:
        description: "(선택) 이 줄 번호부터 다시 받기. 비워 두면 저장된 위치부터 이어받고, 처음이면 1번부터"
        default: ""
        required: false

# 같은 meeting_id 를 동시에 두 번 수집하지 않도록 한다.
concurrency:
  group: collect-${{ inputs.meeting_id }}
  cancel-in-progress: false

permissions:
  contents: write   # data 브랜치에 결과 커밋

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      DATA_BRANCH: data
    steps:
      - uses: actions/checkout@v4

      - name: Prepare data branch worktree
        run: |
          git config user.name  "wipo-s2t-bot"
          git config user.email "wipo-s2t-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$DATA_BRANCH"
            git worktree add ../data "origin/$DATA_BRANCH" -B "$DATA_BRANCH"
          else
            git worktree add --detach ../data
            (cd ../data && git checkout --orphan "$DATA_BRANCH" && git rm -rf . >/dev/null 2>&1 || true)
          fi

      - name: Resolve data dir (absolute path)
        run: echo "DATA_DIR=$(cd .. && pwd)/data" >> "$GITHUB_ENV"

      - name: Collect (commits results every 2 min)
        env:
          MEETING_ID: ${{ inputs.meeting_id }}
          MAX_MIN: ${{ inputs.max_minutes }}
          IDLE_MIN: ${{ inputs.idle_exit_minutes }}
          START_LINE: ${{ inputs.start_line }}
        run: |
          OUT="../data/transcripts/${MEETING_ID}"
          mkdir -p "$OUT"

          save() {
            # 아젠더(docs/agenda.json) 기준 발표별 분할. 실패해도 수집은 계속한다.
            python3 split_by_agenda.py --in "$OUT" --agenda docs/agenda.json --out "$OUT/by_session" --quiet \
              || echo "split failed (ignored)"
            ( cd ../data
              git add -A
              if ! git diff --cached --quiet; then
                git commit -q -m "transcript update $(date -u +%FT%TZ)"
                git push -q origin "HEAD:${DATA_BRANCH}" || { git pull -q --rebase origin "${DATA_BRANCH}" && git push -q origin "HEAD:${DATA_BRANCH}"; }
              fi )
          }

          # 수집기가 비정상 종료(rc!=0)하면 저장된 위치부터 자동 재시작한다. 정상 종료(rc=0: 시간 초과/회의 종료)면 멈춘다.
          run_collector() {
            DEADLINE=$(( $(date +%s) + MAX_MIN * 60 ))
            EXTRA=""; [ -n "$START_LINE" ] && EXTRA="--start-line $START_LINE"
            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
              python3 -u collect.py --meeting-id "$MEETING_ID" --out "$OUT" $EXTRA \
                --max-seconds "$(( DEADLINE - $(date +%s) ))" --idle-exit-minutes "$IDLE_MIN"
              rc=$?
              [ "$rc" -eq 0 ] && break
              RESTARTS=$(( ${RESTARTS:-0} + 1 ))
              if [ "$RESTARTS" -ge 20 ]; then echo "collector keeps crashing; giving up"; touch /tmp/collector_failed; break; fi
              echo "collector exited with rc=$rc; restart #$RESTARTS in 10s (resumes from saved position)"
              EXTRA=""; sleep 10
            done
          }
          run_collector &
          PID=$!

          while kill -0 "$PID" 2>/dev/null; do
            for _ in $(seq 1 24); do kill -0 "$PID" 2>/dev/null || break; sleep 5; done
            save || echo "save failed (will retry)"
          done
          wait "$PID" || true
          save
          if [ -f /tmp/collector_failed ]; then echo "::error::collector crashed repeatedly"; exit 1; fi

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-${{ inputs.meeting_id }}
          path: ${{ env.DATA_DIR }}/transcripts/${{ inputs.meeting_id }}
          if-no-files-found: ignore
